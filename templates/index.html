<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Bullying Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/" class="active">HOME</a>
        <span class="separator">|</span>
        <a href="/feed">FEED</a>
        <span class="separator">|</span>
        <a href="/how-it-works">HOW IT WORKS</a>
        <span class="separator">|</span>
        <a href="/history">HISTORY</a>
        <span class="separator">|</span>
        <a href="/awareness">AWARENESS</a>
        <span class="separator">|</span>
        <a href="/examples">EXAMPLES</a>
        <span class="separator">|</span>
        <a href="/performance">PERFORMANCE</a>
    </nav>

    <div class="card">
        <h1>Cyber Bullying Detection System</h1>
        <p class="subtitle">Social Media Comment Analysis using NLP</p>

        <form action="/" method="POST">
            <textarea 
                name="comment" 
                rows="4" 
                placeholder="Enter a social media comment..." 
                required>{{ entered_comment if entered_comment else '' }}</textarea>

            <button type="submit">Check Comment</button>
        </form>

        {% if prediction %}
        <div class="result-box">
            <div class="result-line">
                <span class="label">Prediction:</span>
                <span class="value">{{ prediction }}</span>
            </div>
            <div class="result-line">
                <span class="label">Confidence:</span>
                <span class="value">{{ confidence }}</span>
            </div>
            <a href="/" class="clear-btn">Clear</a>
        </div>

        <script>
            // Save to localStorage history
            try {
                const comment = {{ entered_comment | tojson }};
                const prediction = {{ prediction | tojson }};
                const confidence = {{ confidence | tojson }};
                if (comment) {
                    const history = JSON.parse(localStorage.getItem("detection_history") || "[]");
                    history.unshift({ comment, prediction, confidence, timestamp: new Date().toLocaleTimeString() });
                    localStorage.setItem("detection_history", JSON.stringify(history.slice(0, 30)));
                }
            } catch (e) {
                console.error(e);
            }
        </script>
        {% endif %}
    </div>
</body>
</html>
